[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "crepes"
version = "0.2.0"
description = "CloudFormation template processor"
dependencies = [
    "boto3",
    "cfn-tools",
    "jinja2"
]

[project.scripts]
crepes = "crepes.crepes:main"
